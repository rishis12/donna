version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: donna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-donna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-donna_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-donna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - donna-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: donna-backend
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://donna:changeme@postgres:5432/donna_db}
      
      # Server
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-changeme-32-bytes-long-key-here}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ENV: ${ENV:-production}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-${SECRET_KEY}}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # Groq API
      GROQ_API_KEY: ${GROQ_API_KEY}
      
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      
      # Microsoft OAuth
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      
      # Slack OAuth
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount .env file if exists (for local dev)
      - ../backend/.env:/app/.env:ro
    networks:
      - donna-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  donna-network:
    driver: bridge

