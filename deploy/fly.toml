# fly.toml app configuration file generated for donna-backend on 2024-01-22T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "donna-backend"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  ENV = "production"
  JWT_ALGORITHM = "HS256"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1

